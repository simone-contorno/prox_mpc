# ProxMPC controller preset (FollowPath block) — PREDICTIVE variant for the
# benchmark matrix. Deliberately IDENTICAL to proxmpc.yaml in every knob except
# that dynamic obstacles enter through prediction: predict_obstacles is on and the
# benchmark launch starts prox_mpc_obstacle_tracker on the simulated /scan. Keeping
# max_obstacles 4 / cbf_gamma 1.0 identical to the reactive preset isolates the
# effect of prediction alone (the demo's dense-field tuning, cbf_gamma 0.3 /
# max_obstacles 2, over-committed on these single-obstacle cells and stalled the
# robot ~1.7 m short of the obstacle). A confirmed *moving* track is propagated over
# the horizon and bound to a dynamic slot; the static box/walls still come from the
# costmap (hybrid).
FollowPath:
  plugin: "prox_mpc_controller::ProxMpcController"
  np: 20
  nc: 20
  dt: 0.1
  desired_linear_vel: 0.5
  q_pos: 10.0
  q_theta: 1.0
  s_factor: 2.0
  r_weight: 0.1
  w_weight: 100.0
  max_int_iter_qp: 1500
  max_ext_iter_qp: 10000
  max_iter_sqp: 100
  qp_type: false
  guess: true
  max_solver_failures: 3
  max_obstacles: 4
  safety_margin: 0.1
  robot_radius: 0.22
  cbf_gamma: 1.0
  costmap_cost_threshold: 200
  obstacle_cluster_radius: 0.3
  # Predictive (dynamic) obstacle avoidance ENABLED. Consumes the tracker's
  # /tracked_obstacles (odom frame); a confirmed moving track is anticipated over
  # the horizon, static structure stays costmap-driven (hybrid).
  predict_obstacles: true
  obstacle_topic: "tracked_obstacles"
  obstacle_timeout: 0.5
  dynamic_speed_threshold: 0.2
  prediction_uncertainty_growth: 0.0
  max_dynamic_obstacles: 1
  max_dynamic_obstacle_radius: 0.5
  # Opt-in per-cycle SolverDiagnostics; only-when-subscribed so the metrics node
  # taps FollowPath/diagnostics with zero cost when nothing listens.
  publish_diagnostics: true
