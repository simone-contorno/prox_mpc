# Vector Pursuit Controller preset (FollowPath block) for cross-controller comparison.
# vector_pursuit_controller (external, Apache-2.0): a lookahead-carrot geometric
# tracker like Regulated Pure Pursuit, with an added cost-regulated velocity
# scaling and an internal forward-collision check (use_collision_detection). Only
# the shared operating envelope is equalised here: the 0.5 m/s speed cap (already
# the upstream default) and a lookahead comparable to Regulated Pure Pursuit's
# (lookahead_dist 0.4 / min_lookahead_dist 0.3 / max_lookahead_dist 0.9). Every
# Vector-Pursuit-intrinsic mechanism knob (k, min_turning_radius,
# use_collision_detection, cost_scaling_*, inflation_cost_scaling_factor,
# use_rotate_to_heading, the accel limits, use_interpolation, ...) stays at the
# upstream sample default so the method runs at its documented operating point.
FollowPath:
  plugin: "vector_pursuit_controller::VectorPursuitController"
  k: 6.0
  desired_linear_vel: 0.5     # shared 0.5 m/s speed cap (matches upstream default)
  min_turning_radius: 0.25
  lookahead_dist: 0.4         # fair tuning: matches Regulated Pure Pursuit's lookahead_dist
  min_lookahead_dist: 0.3     # fair tuning: matches Regulated Pure Pursuit's min_lookahead_dist
  max_lookahead_dist: 0.9     # fair tuning: matches Regulated Pure Pursuit's max_lookahead_dist
  lookahead_time: 1.5
  rotate_to_heading_angular_vel: 0.5
  transform_tolerance: 0.1
  use_velocity_scaled_lookahead_dist: true
  min_linear_velocity: 0.0
  min_approach_linear_velocity: 0.0
  approach_velocity_scaling_dist: 1.0
  max_allowed_time_to_collision_up_to_target: 1.0
  use_collision_detection: true
  use_cost_regulated_linear_velocity_scaling: true
  cost_scaling_dist: 0.5
  cost_scaling_gain: 1.0
  inflation_cost_scaling_factor: 3.0
  use_rotate_to_heading: true
  allow_reversing: false
  rotate_to_heading_min_angle: 0.5
  max_angular_accel: 3.0
  max_linear_accel: 2.0
  max_lateral_accel: 0.2
  max_robot_pose_search_dist: 10.0
  use_interpolation: true
  use_heading_from_path: false
