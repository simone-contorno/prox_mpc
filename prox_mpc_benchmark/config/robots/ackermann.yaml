# Ackermann (car-like) robot paired with a ProxMPC bicycle model.
# Mode (a) spawns the SDF in models/ackermann_robot and bridges a body Twist to
# Ackermann steering via ros_gz; mode (b2) gives the kinematic plant a bicycle
# integrator. For the standalone mode (b1) only `model` is relevant.
robot:
  name: ackermann
  model: bicycle                      # 4-state [x, y, theta, delta]
  model_plugin: prox_mpc_core/BicycleFrontAxle
  drive: ackermann
  wheelbase: 1.0                  # L [m]; must match the SDF and model_params.L
  robot_radius: 0.5
  # Bounds the ProxMPC model's linear input (v_max); the commanded speed is
  # hard-capped in the solver at 0.5 m/s, matching the stock controllers' caps.
  max_linear_vel: 0.5
  max_steer_angle: 0.6            # [rad]
  gazebo:
    description_package: prox_mpc_benchmark
    spawn: ackermann_robot        # models/ackermann_robot/model.sdf (mode a)
    steering_bridge: true         # ros_gz Twist -> Ackermann steering
