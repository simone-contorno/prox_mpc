scenario:
  name: nav2_open
  description: "Open 7x7 m room, straight traverse. The controller-agnostic cell for the cross-controller comparison, run on the mode (b2) kinematic plant so every controller drives the identical deterministic plant."
  map:
    base: prox_mpc_open       # reuse prox_mpc_demo/maps/prox_mpc_open.{yaml,pgm}
    yaml: prox_mpc_open.yaml
    scale: 1.0
  # The map free interior is [-2.95, 2.95] m (a thick wall band); endpoints sit at
  # +/-2.5 so both start and goal are clear of the wall inflation and the planner
  # can produce a path (a 5 m straight traverse).
  start: {x: -2.5, y: 0.0, yaw: 0.0}
  goals:
    - {x: 2.5, y: 0.0, yaw: 0.0}
  obstacles: []
  models: [unicycle]                                                        # diff-drive waffle / Unicycle
  controllers: [proxmpc, dwb, mppi, regulated_pure_pursuit, graceful, vector_pursuit]   # cross-controller set
  run: {repeats: 5, timeout_s: 60, seed: 0}
