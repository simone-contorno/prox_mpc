scenario:
  name: dynamic_circle
  description: "A single obstacle orbiting near the mid-path; ProxMPC must yield and recover."
  map:
    base: prox_mpc_open
    scale: 1.0
  start: {x: -3.0, y: 0.0, yaw: 0.0}
  goals:
    - {x: 3.0, y: 0.0, yaw: 0.0}
  obstacles:
    # center / radius / speed (sign = ccw/cw). Orbits around (1, 0) crossing the path.
    - {type: dynamic, motion: circle, center: {x: 1.0, y: 0.0}, radius: 0.8, speed: 0.5, clearance: 0.6}
  models: [r2d2, bike]
  controllers: [proxmpc]
  run: {repeats: 5, timeout_s: 60, seed: 0}
