scenario:
  name: dynamic_line_backward
  description: "Same crossing patrol as dynamic_line_forward but the first leg runs backward (to -> from)."
  map:
    base: prox_mpc_open
    scale: 1.0
  # Endpoints at +/-2.5 keep the mode (b2) plan inside the navigable interior
  # ([-2.95, 2.95] m); the patrol crosses y=0 at x=0, still on the path.
  start: {x: -2.5, y: 0.0, yaw: 0.0}
  goals:
    - {x: 2.5, y: 0.0, yaw: 0.0}
  obstacles:
    # Patrol from (0,-2) to (0,2); -speed = backward leg first (starts at "to"). Crosses y=0 at x=0.
    - {type: dynamic, motion: line, from: {x: 0.0, y: -2.0}, to: {x: 0.0, y: 2.0}, speed: -0.6, clearance: 0.45}
  models: [unicycle, bicycle]
  controllers: [proxmpc, dwb, mppi, regulated_pure_pursuit, graceful, vector_pursuit]   # cross-controller set (b2)
  run: {repeats: 5, timeout_s: 60, seed: 0}
