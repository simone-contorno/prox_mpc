# prox_mpc_obstacle_tracker configuration (single source of truth for the
# tracker's parameters). The detector clusters a 2D LaserScan, transforms the
# centroids into a fixed tracking frame, and runs one IMM (constant-velocity
# + constant-turn-rate) filter per track, publishing sampled predicted
# positions per obstacle. All parameters are double / int / bool / string per
# the project type rules.
prox_mpc_obstacle_tracker:
  ros__parameters:
    # Logging.
    log_level: "info"                  # node-only verbosity: debug/info/warn/error/fatal

    # Interfaces.
    scan_topic: "scan"                 # input sensor_msgs/LaserScan (sensor-data QoS)
    output_topic: "tracked_obstacles"  # output prox_mpc_msgs/ObstacleArray (reliable)
    tracking_frame: "odom"             # non-rotating frame velocity is estimated in

    # Detection / clustering.
    cluster_gap: 0.3            # [m] Euclidean gap that closes a cluster
    min_cluster_points: 3      # drop clusters with fewer member returns
    max_clusters: 20           # cap clusters per scan (largest kept) to bound cost
    # Reject extended structure (walls): their cluster centroid is not a stable
    # physical point and drifts as the robot moves, so without this they would be
    # tracked as phantom fast-moving obstacles. 0 disables the filter; a compact
    # obstacle (person/box) is well under this, a wall well over it.
    max_cluster_radius: 0.6    # [m] drop clusters whose enclosing radius exceeds this
    min_detection_range: 0.0   # [m] lower range cutoff (0 -> use the scan range_min)
    # Upper range cutoff. Matches the costmap obstacle_max_range so the tracker
    # sees exactly as far as every costmap-driven controller (equal perception).
    # 2.5 caused track churn: an orbiting obstacle drifted in/out of range, each
    # re-birth reset the turn-rate estimate. Wall rejection is max_cluster_radius's
    # job, not this cutoff's.
    max_detection_range: 3.0   # [m] upper range cutoff (0 -> use the scan range_max)
    # Arc-centroid -> disc-centre correction. A lidar sees only the near arc of
    # a compact obstacle, so the raw cluster centroid is biased toward the
    # sensor and SLIDES around the disc as the robot passes — measured
    # 2026-07-04 as ~0.3 m position error plus fake tangential velocity that
    # cancelled the true motion during close passes (collision-fix-b2-log.md).
    # The centroid is pushed away from the sensor along its ray by this fraction
    # of the enclosing cluster radius (0.5 ~ exact for the close-range half-disc
    # arc; under-corrects thin far arcs, which stays conservative). 0 disables.
    cluster_center_offset_gain: 0.5   # [0..1] fraction of the cluster radius
    transform_timeout: 0.1     # [s] TF lookup timeout for the scan -> tracking frame

    # Association.
    association_gate: 0.5       # [m] max track-to-cluster gating distance

    # Constant-velocity model (IMM model 1; also the legacy single-CV filter).
    process_noise: 0.1              # accel spectral density q [m^2/s^4]
    # Position measurement variance, calibrated to the actual centroid noise of
    # the benchmark scan simulator (~2-4 cm quantization jitter -> ~0.002 m^2).
    # The previous 0.01 (0.1 m std) over-stated it 5x, so the filter trusted its
    # own motion model over the data: after an obstacle direction reversal the
    # tracked position lagged the true one by ~0.4 m for ~1 s (measured 2026-07-04,
    # collision-fix-b2-log.md) and the velocity converged only after ~1 s at birth.
    # Re-calibrate per sensor on real hardware.
    measurement_noise: 0.002        # position measurement variance [m^2]
    initial_velocity_variance: 1.0  # initial vx/vy variance [m^2/s^2]

    # IMM (CV + CTRV). imm_enabled: false restores the legacy single-CV path
    # without a rebuild. CV stay 0.95 gives a ~20-scan expected mode dwell at
    # 10 Hz; CTRV stay 0.99 keeps the turning model sticky on sustained
    # orbits (b2 tuning, 2026-07-03). Both must lie in (0.0, 1.0) exclusive.
    imm_enabled: true
    imm_p_cv_stay: 0.95               # Markov P(CV -> CV); off-diagonal is 1 - this
    imm_p_ctrv_stay: 0.99             # Markov P(CTRV -> CTRV); off-diagonal is 1 - this
    ctrv_process_noise_accel: 1.0     # sigma_a^2 [m^2/s^4] (discrete white-noise form), >= 0
    ctrv_process_noise_yaw_accel: 1.0 # sigma_wd^2 [rad^2/s^4] (omega random walk), >= 0
    ctrv_init_omega_variance: 1.0     # [rad^2/s^2] omega variance at birth / CV->CTRV mix, > 0

    # Predicted samples per obstacle. 25 x 0.1 s = 2.5 s covers the
    # controller's maximum prediction time np*dt + obstacle_timeout
    # (2.0 + 0.5 s at the benchmark preset), so the controller always
    # interpolates, never extrapolates. prediction_steps in [0, 100]
    # (0 publishes none: the controller falls back to straight-ray);
    # prediction_dt > 0.
    prediction_steps: 25   # [samples] predicted positions published per obstacle
    prediction_dt: 0.1     # [s] spacing between predicted samples

    # Track lifecycle. drop_count stays small on purpose: a long-coasting track
    # turns into a published phantom after an association break (e.g. an obstacle
    # direction reversal), which competes with the re-acquired real track for the
    # controller's dynamic slots (measured 2026-07-04). Track continuity through
    # range dropouts is owned by max_detection_range, not by coasting.
    confirm_count: 3   # consecutive hits before a track is published
    drop_count: 3      # consecutive misses tolerated before a track is dropped
    max_tracks: 10     # cap on simultaneously held tracks
