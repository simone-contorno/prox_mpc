prox_mpc_simulation:
  ros__parameters:
    # "bicycle" (4-state) or "unicycle" (3-state).
    model: "bicycle"

    # Horizons and step size.
    np: 20            # prediction horizon shooting nodes
    nc: 20            # control horizon shooting nodes
    dt: 0.1           # step size [s]

    # Cost weights (diagonal, sized to the model).
    q_pos: 10.0       # intermediate position weight
    q_theta: 1.0      # intermediate heading/steering weight
    s_factor: 2.0     # terminal weight = s_factor * Q
    r_weight: 0.1     # control weight
    w_weight: 100.0   # obstacle slack penalty

    # Start pose. start_theta is applied by any model with >= 3 states.
    start_x: 0.0      # initial position x [m]
    start_y: 0.0      # initial position y [m]
    start_theta: 0.0  # initial heading [rad]

    # Reference.
    v_ref: 1.0        # desired forward speed [m/s]
    goal_x: 5.0       # goal position x [m]
    goal_y: 0.0       # goal position y [m]
    goal_theta: 0.0   # goal heading [rad]
    goal_tol: 0.25    # goal reached when within this distance [m]

    # Obstacle (off by default for a clean tracking demo).
    obstacle_enable: false
    max_obstacles: 1      # K: obstacle slots per predicted node (capacity)
    d_safe: 1.0           # required clearance [m] (robot radius + inflation + margin)
    obs_x: 2.5
    obs_y: 0.6

    # Logging and telemetry.
    report_period: 50         # log solve-time stats every N control steps
    log_level: "info"         # debug | info | warn | error | fatal
    publish_diagnostics: true # publish prox_mpc_msgs/SolverDiagnostics per cycle
